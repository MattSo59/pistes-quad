name: Publication de l'appli

# L'appli est publiée seule (1 à 2 minutes) : elle reprend les données de carte déjà calculées
# (branche « donnees », fabriquée par le workflow « Cartographie (données) »).
on:
  push:
    branches: [main]
    paths-ignore: ['tools/**', '.github/workflows/donnees.yml', 'PROJET.md']
  workflow_dispatch:
  workflow_run:
    workflows: ['Cartographie (données)']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: publication
  cancel-in-progress: true

jobs:
  publier:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Reprendre les données de carte
        run: |
          REPO="https://github.com/${{ github.repository }}.git"
          # branche « donnees » ; à défaut (première fois), les données déjà en ligne
          git clone -q --depth 1 --branch donnees "$REPO" _d || git clone -q --depth 1 --branch publication "$REPO" _d
          rm -rf site/data && mv _d/data site/data && rm -rf _d
          test -s site/data/index.json
          du -sh site/data

      - name: Déposer l'appli prête sur la branche « publication » (lue par Cloudflare et par GitHub Pages)
        run: |
          cp worker/worker.js worker/wrangler.jsonc worker/.assetsignore site/
          cd site
          git init -q -b publication
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Publication $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" publication
